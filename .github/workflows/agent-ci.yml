name: Agent CI

on:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./agent/

      - name: Ruff lint
        continue-on-error: true
        run: python -m ruff check agent/ --output-format=json > ruff-results.json

      - name: Mypy type-check
        continue-on-error: true
        run: python -m mypy agent/

      - name: Pytest with coverage
        run: python -m pytest agent/tests/ --cov=agent --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=80

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: agent
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate summary JSON artifacts
        if: always()
        run: |
          python -c "
          import json, os

          # Test results JSON (from coverage data)
          test_results = {'summary': {'passed': 0, 'failed': 0, 'skipped': 0, 'total': 0}}
          if os.path.exists('coverage.json'):
              try:
                  with open('coverage.json') as f:
                      cov_data = json.load(f)
                  totals = cov_data.get('totals', {})
                  test_results['summary']['total'] = totals.get('num_statements', 0)
                  test_results['summary']['passed'] = totals.get('num_statements', 0) - (totals.get('missing_lines', 0) or 0)
              except: pass
          with open('test-results.json', 'w') as f:
              json.dump(test_results, f)

          # Lint results JSON (from ruff --output-format=json)
          lint_results = {'issues': 0}
          if os.path.exists('ruff-results.json'):
              try:
                  with open('ruff-results.json') as f:
                      ruff_data = json.load(f)
                  lint_results['issues'] = len(ruff_data) if isinstance(ruff_data, list) else 0
              except json.JSONDecodeError:
                  pass
          with open('lint-results.json', 'w') as f:
              json.dump(lint_results, f)

          print('Summary JSON artifacts generated')
          "

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent
          path: |
            coverage.json
            test-results.json
            lint-results.json
          retention-days: 7
