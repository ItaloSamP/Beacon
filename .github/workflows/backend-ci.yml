name: Backend CI

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'alembic/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'alembic/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beacon_user
          POSTGRES_PASSWORD: beacon_pass
          POSTGRES_DB: beacon_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://beacon_user:beacon_pass@localhost:5432/beacon_db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U beacon_user -d beacon_db; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Ruff lint
        continue-on-error: true
        run: python -m ruff check . --output-format=json > ruff-results.json

      - name: Mypy type-check
        run: python -m mypy app/

      - name: Pytest with coverage
        continue-on-error: true
        run: python -m pytest --cov=app --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Bandit security scan
        run: python -m bandit -r app/ -ll -f json -o bandit-results.json

      - name: Generate summary JSON artifacts
        if: always()
        run: |
          python -c "
          import json, os

          # Coverage JSON (generated by --cov-report=json)
          # pytest-cov outputs coverage.json directly

          # Test results JSON
          test_results = {'summary': {'passed': 0, 'failed': 0, 'skipped': 0, 'total': 0}}
          if os.path.exists('.test-results.json'):
              with open('.test-results.json') as f:
                  test_results = json.load(f)
          with open('test-results.json', 'w') as f:
              json.dump(test_results, f)

          # Lint results JSON (from ruff --output-format=json)
          lint_results = {'issues': 0}
          if os.path.exists('ruff-results.json'):
              try:
                  with open('ruff-results.json') as f:
                      ruff_data = json.load(f)
                  lint_results['issues'] = len(ruff_data) if isinstance(ruff_data, list) else 0
              except json.JSONDecodeError:
                  pass
          with open('lint-results.json', 'w') as f:
              json.dump(lint_results, f)

          # Security results JSON (from bandit -f json)
          security_results = {'score': 100, 'total_issues': 0}
          if os.path.exists('bandit-results.json'):
              try:
                  with open('bandit-results.json') as f:
                      bandit_data = json.load(f)
                  issues = bandit_data.get('results', []) if isinstance(bandit_data, dict) else []
                  security_results['total_issues'] = len(issues)
                  security_results['score'] = max(0, 100 - len(issues) * 5)
              except json.JSONDecodeError:
                  pass
          with open('security-results.json', 'w') as f:
              json.dump(security_results, f)

          print('Summary JSON artifacts generated')
          "

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.json
            test-results.json
            lint-results.json
            security-results.json
          retention-days: 7
